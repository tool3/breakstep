<svg xmlns="http://www.w3.org/2000/svg" width="128" height="144"
     viewBox="0 0 128 144" role="img" aria-labelledby="bs-nested">
  <title id="bs-nested">Breakstep</title>
  <!--
    Breakstep — Nested. The S sunk into the B.

    The B and the S share one 96×112 footprint at the same origin, with the S over the
    top. Every stroke of the S falls inside a stroke of the B — which is why the
    silhouette of this mark is the B and the colour of it is the S, and why showing
    the B at all takes a deliberate device.

    Treatment: the S is inset four units inside the B on every edge, so the B reads
    as a solid letter with the S sitting in a channel cut through it. Both letters
    are whole — the B's spine, bars, notch and both bowls are all there, and the S
    is unbroken inside them. This is the most legible of the set and the one that
    survives being made small.

    Grid: stroke 24, counters 20, bars at 24/44/88/112. Colours are the debugger's own
    legend from viz.module.scss — active, compare, visited, match.
  -->
  <defs>
    <clipPath id="bs-nested-b" transform="translate(16 16)">
      <rect x="0" y="0" width="24" height="112" />
      <rect x="0" y="0" width="80" height="24" />
      <rect x="56" y="0" width="24" height="68" />
      <rect x="0" y="44" width="96" height="24" />
      <rect x="72" y="44" width="24" height="68" />
      <rect x="0" y="88" width="96" height="24" />
    </clipPath>
  </defs>

  <!-- Frame: the mark plus 16 a side, so it keeps the letterforms' proportions. -->
  <rect width="128" height="144" rx="18" fill="#1a1a1a" />
  <rect x="0.5" y="0.5" width="127" height="143" rx="17.5" fill="none" stroke="#3e3e3e" />

  <g transform="translate(16 16)">
    <!-- B — solid underneath, in the active blue -->
    <g fill="#58a6ff">
      <!-- spine -->
      <rect x="0" y="0" width="24" height="112" />
      <!-- top bar, cut short — the notch that makes it a B and not an 8 -->
      <rect x="0" y="0" width="80" height="24" />
      <!-- upper riser, inset by the notch -->
      <rect x="56" y="0" width="24" height="68" />
      <!-- middle bar -->
      <rect x="0" y="44" width="96" height="24" />
      <!-- lower riser, flush right -->
      <rect x="72" y="44" width="24" height="68" />
      <!-- bottom bar -->
      <rect x="0" y="88" width="96" height="24" />
    </g>

    <!-- S — solid over it, in the match mint -->
    <g fill="#2cbb5d">
      <!-- top bar -->
      <rect x="0" y="0" width="80" height="24" />
      <!-- upper riser, left -->
      <rect x="0" y="0" width="24" height="68" />
      <!-- middle bar, short -->
      <rect x="0" y="44" width="76" height="24" />
      <!-- lower riser, right -->
      <rect x="72" y="44" width="24" height="68" />
      <!-- bottom bar, short -->
      <rect x="0" y="88" width="86" height="24" />
    </g>

    <!-- The rim. Stroking the S's own outline in the B's colour sinks the S 4
         units into it on every edge, which is the one way to get a clean inset
         out of a union of rectangles — eroding them one by one would open a
         notch at every join. Clipped to the B so it cannot spill outside. -->
    <g clip-path="url(#bs-nested-b)">
      <path d="M0,0 H80 V24 H24 V44 H96 V112 H0 V88 H72 V68 H0 Z" fill="none" stroke="#58a6ff" stroke-width="8" />
    </g>
  </g>
</svg>
