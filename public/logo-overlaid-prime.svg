<svg xmlns="http://www.w3.org/2000/svg" width="137" height="150" viewBox="0 0 137 150" role="img"
  aria-labelledby="bs-overlaid">
  <title id="bs-overlaid">Breakstep</title>
  <!-- Frame: the mark plus 16 a side. The play triangle takes it to 105 wide, and
       moving the bars down to 50/94 took the letter to 118 tall — the old 144 left
       only 10 under the bottom bar against 16 above the top one. -->
  <rect width="137" height="150" rx="18" fill="#141414" />
  <rect x="0.5" y="0.5" width="136" height="149" rx="17.5" fill="none" stroke="#3e3e3e" />

  <g transform="translate(16 16)">
    <!-- B — underneath, in the active blue -->
    <g fill="#F38671">
      <!-- spine -->
      <rect x="0" y="0" width="24" height="112" />
      <!-- top bar, cut short — the notch that makes it a B and not an 8 -->
      <rect x="0" y="0" width="80" height="24" />
      <!-- upper riser, inset by the notch -->
      <rect x="56" y="0" width="24" height="68" />
      <!-- middle bar -->
      <rect x="0" y="50" width="96" height="24" />
      <!-- lower riser, flush right -->
      <rect x="72" y="50" width="24" height="68" />
      <!-- bottom bar -->
      <rect x="0" y="94" width="96" height="24" />
    </g>

    <!-- The left block, recoloured: the two exposed blocks are the only
         B left to see, so they get two different states rather than one. -->
    <g fill="#ffb800">
      <!-- left block — compare amber -->
      <rect x="0" y="68" width="24" height="27" />
    </g>

    <!-- Cross sections: tile colour, so each block reads as sitting behind
         the S rather than joined to it. -->
    <g fill="#141414">

      <rect x="55" y="24" width="26" height="2" />
      <rect x="55" y="48" width="26" height="2" />

      <rect x="-1" y="68" width="26" height="5" />
      <rect x="-1" y="74" width="26" height="2" />

      <!-- vertical -->
      <rect x="10" y="73" width="4" height="20" />

      <rect x="0" y="92" width="26" height="2" />
    </g>

    <!-- S — over the top, in the match mint -->
    <g fill="#8AD184">
      <!-- top bar -->
      <rect x="0" y="0" width="80" height="24" />
      
      <!-- Play/pause, the leftmost of the debugger's floating controls. It lives in
           the pocket the B's notch leaves at the top right, reads at the same 24-unit
           height as the bar it grew out of, and keeps the same 2-unit gap the stripe
           already has from the top bar. 16 wide rather than the ~20 an equilateral
           triangle would want: at 20 the glyph starts outweighing the letterforms. -->
      <rect x="82" y="0" width="5" height="24" />
      <!-- Hollow, like the newer play glyph. Stroked rather than knocked out with a
           second polygon, so the hole is genuinely transparent and survives the
           frame being removed. The points are pulled in by half the stroke width —
           the triangle's incircle is only 6 units, so a 3-unit wall is the most it
           takes before the hole starts closing — and miter joins put the stroke's
           outer edge back exactly on 89,0 / 105,12 / 89,24, which is where the
           filled triangle's edge was. Same footprint, same 2-unit gap. -->
      <polygon points="90.5,3 102.5,12 90.5,21" fill="none" stroke="#8AD184" stroke-width="3" />


      <!-- upper riser, left -->
      <rect x="0" y="0" width="24" height="68" />
      <!-- middle bar, short — lets the B through below it -->
      <rect x="0" y="50" width="76" height="24" />
      <!-- lower riser, right -->
      <rect x="72" y="50" width="24" height="68" />
      <!-- bottom bar, short -->
      <rect x="0" y="94" width="86" height="24" />
    </g>
  </g>
</svg>